<h1>Login callback</h1>
<p>Copy the text below and paste it back to the tool. Do not share it with anyone else.</p>
<pre id="o" style="background:#f3f3f3;padding:12px;white-space:pre-wrap;word-break:break-all">(no code in the address)</pre>
<script>var u=new URL(location.href);var c=u.searchParams.get("code"),s=u.searchParams.get("state"),e=u.searchParams.get("error");
document.getElementById("o").textContent=e?("error: "+e):c?("code: "+c+"\nstate: "+s):"(no code in the address)";
history.replaceState(null,"",location.pathname);</script></body></html>
